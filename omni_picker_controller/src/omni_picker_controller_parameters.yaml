omni_picker_controller:
  topic_prefix: {
    type: string,
    default_value: "",
    description: "Topic prefix to add to all topics",
    read_only: true,
  }
  action_monitor_rate: {
    type: double,
    default_value: 20.0,
    description: "Hz",
    read_only: true,
    validation: {
      gt_eq: [ 0.1 ]
    },
  }
  joints: {
    type: string_array,
    default_value: [],
    description: "Joint names to control and listen to",
    read_only: true,
    validation: {
      unique<>: null,
    }
  }
  max_velocity: {
    type: double,
    default_value: 1.0,
    description: "Default target velocity used for grasping (meters/second)",
    validation: {
      gt_eq: [ 0.0 ]
    },
  }
  max_effort: {
    type: double,
    default_value: 1.0,
    description: "Default effort used for grasping (Newtons)",
    validation: {
      gt_eq: [ 0.0 ]
    },
  }